# Publier une version : git tag v1.0.1.0 && git push origin v1.0.1.0
# → compile, crée la release GitHub avec le .zip, puis met à jour manifest.json sur main.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compiler
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ABI="$(grep -oP '(?<=<JellyfinVersion>)[^<]+' Jellyfin.Plugin.DlHelper/Jellyfin.Plugin.DlHelper.csproj).0"
          ./build.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "zip=artifacts/dl-helper_${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" \
            --title "dl-helper ${{ steps.build.outputs.version }}" \
            --notes "${NOTES:-Jellyfin ${{ steps.build.outputs.abi }}}"

      - name: Mettre à jour manifest.json
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/dl-helper_${{ steps.build.outputs.version }}.zip"
          NOTES="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          python3 scripts/update_manifest.py "${{ steps.build.outputs.version }}" "${{ steps.build.outputs.zip }}" "$URL" "${{ steps.build.outputs.abi }}" "$NOTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest.json : version ${{ steps.build.outputs.version }}"
          git push origin main
